# Pins move by reviewed pull requests, never silently. Actions are pinned to
# commit SHAs (scripts/check-tree.sh fails on anything else), and Dependabot
# proposes the new SHA with its version comment, monthly, one grouped pull
# request per ecosystem.
#
# A Dependabot pull request is a proposal only: its commits carry no
# Signed-off-by, so under the DCO rule it is never merged as is. A maintainer
# re-applies the change as a signed commit on a new branch, opens that pull
# request, and closes the Dependabot one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      go-modules:
        patterns: ["*"]
