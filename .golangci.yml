version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - usestdlibvars
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
formatters:
  enable:
    - gofmt
    - goimports
